[package]
name = "clipvault"
version = "2.1.0"
edition = "2021"
rust-version = "1.88"
description = "Private native Linux clipboard history"
license = "MIT"

[package.metadata.deb]
extended-description = "ClipVault keeps a local history of copied text and images. Open it with a keyboard shortcut to search, pin, and reuse previous clips."
maintainer = "Md Biplob Hosain"
copyright = "2026, Md Biplob Hosain"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
# dlopen() libraries are invisible to cargo-deb's ELF dependency scan.
depends = "$auto, libc6 (>= 2.39), libsqlite3-0, libgdk-pixbuf-2.0-0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2, libxinerama1, libxrender1, libxfixes3, libxext6, libxkbcommon0, libxkbcommon-x11-0, libxcb1, libxcb-render0, libxcb-shape0, libxcb-xfixes0, libwayland-client0, libwayland-cursor0, libwayland-egl1, libgl1, libegl1, xkb-data"
recommends = "webp-pixbuf-loader, fontconfig, xdg-utils"
maintainer-scripts = "packaging/linux"
assets = [
    ["COMPATIBILITY.md", "usr/share/doc/clipvault/COMPATIBILITY.md", "644"],
    ["PERFORMANCE.md", "usr/share/doc/clipvault/PERFORMANCE.md", "644"],
    ["MIGRATION.md", "usr/share/doc/clipvault/MIGRATION.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/clipvault/CHANGELOG.md", "644"],
    ["packaging/LAUNCHPAD-PPA.md", "usr/share/doc/clipvault/LAUNCHPAD-PPA.md", "644"],
    ["packaging/APT-REPOSITORY.md", "usr/share/doc/clipvault/APT-REPOSITORY.md", "644"],
    ["target/release/clipvault", "usr/bin/clipvault", "755"],
    ["packaging/linux/io.clipvault.desktop.desktop", "usr/share/applications/io.clipvault.desktop.desktop", "644"],
    ["packaging/linux/io.clipvault.desktop.metainfo.xml", "usr/share/metainfo/io.clipvault.desktop.metainfo.xml", "644"],
    ["assets/clipvault.svg", "usr/share/icons/hicolor/scalable/apps/clipvault.svg", "644"],
    ["assets/icons/16x16/clipvault.png", "usr/share/icons/hicolor/16x16/apps/clipvault.png", "644"],
    ["assets/icons/24x24/clipvault.png", "usr/share/icons/hicolor/24x24/apps/clipvault.png", "644"],
    ["assets/icons/32x32/clipvault.png", "usr/share/icons/hicolor/32x32/apps/clipvault.png", "644"],
    ["assets/icons/48x48/clipvault.png", "usr/share/icons/hicolor/48x48/apps/clipvault.png", "644"],
    ["assets/icons/64x64/clipvault.png", "usr/share/icons/hicolor/64x64/apps/clipvault.png", "644"],
    ["assets/icons/128x128/clipvault.png", "usr/share/icons/hicolor/128x128/apps/clipvault.png", "644"],
    ["assets/icons/256x256/clipvault.png", "usr/share/icons/hicolor/256x256/apps/clipvault.png", "644"],
    ["assets/icons/512x512/clipvault.png", "usr/share/icons/hicolor/512x512/apps/clipvault.png", "644"],
    ["LICENSE", "usr/share/doc/clipvault/LICENSE", "644"],
    ["THIRD-PARTY-NOTICES.txt", "usr/share/doc/clipvault/THIRD-PARTY-NOTICES.txt", "644"],
    ["README.md", "usr/share/doc/clipvault/README.md", "644"],
    ["CHANGELOG-v2.1.0.txt", "usr/share/doc/clipvault/CHANGELOG-v2.1.0.txt", "644"],
    ["V2.1.0-VERIFICATION.md", "usr/share/doc/clipvault/V2.1.0-VERIFICATION.md", "644"],
    ["RELEASE-NOTES.md", "usr/share/doc/clipvault/RELEASE-NOTES.md", "644"],
    ["VERIFICATION.md", "usr/share/doc/clipvault/VERIFICATION.md", "644"],
    ["FEATURE-VERIFICATION.md", "usr/share/doc/clipvault/FEATURE-VERIFICATION.md", "644"],
    ["ACTIVATION-VERIFICATION.md", "usr/share/doc/clipvault/ACTIVATION-VERIFICATION.md", "644"],
    ["docs/history.png", "usr/share/doc/clipvault/docs/history.png", "644"],
    ["assets/clipvault.svg", "usr/share/doc/clipvault/assets/clipvault.svg", "644"],
    ["packaging/README.md", "usr/share/doc/clipvault/PACKAGING.md", "644"],
    ["packaging/SOFTWARE-MANAGER-VERIFICATION.md", "usr/share/doc/clipvault/SOFTWARE-MANAGER-VERIFICATION.md", "644"],
]

[dependencies]
ab_glyph = "0.2"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
x11rb = { version = "0.13.2", features = ["xfixes", "xtest", "xkb", "xinput"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = "0.4"
libloading = "0.8"
semver = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
libc = "0.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
