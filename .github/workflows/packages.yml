name: Linux package candidates
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-0 libgdk-pixbuf-2.0-0 libgdk-pixbuf2.0-bin webp-pixbuf-loader libxkbcommon-x11-0 desktop-file-utils appstream libgl1 libegl1 patchelf
      - run: cargo fetch --locked
      - run: cargo test --locked
      - run: bash scripts/install-packaging-tools.sh
      - run: python3 scripts/packaging-support.py notices
      - run: bash scripts/package-linux.sh all
      - run: bash scripts/test-linux-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: clipvault-linux-candidates
          path: dist/
  fedora-rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/package-rpm.sh container --online
      - uses: actions/upload-artifact@v4
        with:
          name: clipvault-fedora-rpm-candidate
          path: dist/*.rpm
          if-no-files-found: error
  ppa-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev devscripts debhelper lintian
      - run: bash scripts/prepare-ppa-source.sh --online
      - run: lintian target/ppa-source/*_source.changes
      - uses: actions/upload-artifact@v4
        with:
          name: clipvault-unsigned-source-candidate
          path: target/ppa-source/clipvault_*.*
  # No release upload: candidates need distribution installation and paste acceptance.
  signed-update-metadata:
    needs: [build, fedora-rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: clipvault-*-candidate*
          merge-multiple: true
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y rpm openssl
      - name: Generate and sign final gathered artifact metadata
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.CLIPVAULT_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo 'Maintainer Ed25519 signing setup is required; no signed metadata was produced.' >&2; exit 1; }
          key_file="$RUNNER_TEMP/clipvault-ed25519.pem"
          umask 077
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key_file"
          python3 scripts/update-metadata.py --signing-key "$key_file"
      - uses: actions/upload-artifact@v4
        with:
          name: clipvault-signed-update-metadata
          path: |
            dist/clipvault-update.json
            dist/clipvault-update.json.sig
            dist/v2.2.0-SHA256SUMS
          if-no-files-found: error
